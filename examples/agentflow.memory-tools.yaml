version: "1"

# Memory + tools smoke test: builtin:conversational memory, builtin:web_search
# tool, and a local OpenAI-compatible model, over webhook.
# The web_search builtin returns honest-unavailable when no search backend is
# configured, so this still exercises the tools path end-to-end.
#
#   curl -X POST localhost:8080/webhook -d '{"from":"alice","text":"hello"}'

models:
  default:
    provider: openai
    model: ${OPENAI_MODEL:-gpt-4o-mini}
    base_url: ${OPENAI_BASE_URL:-http://127.0.0.1:11434/v1}
    api_key: ${OPENAI_API_KEY:-}

memory:
  backends:
    main_db:
      provider: builtin:sqlite
      config:
        path: ./data/agentflow-smoke.db

agents:
  bot:
    loop: builtin:react
    model: default
    instructions: ./instructions/bot.md
    capabilities: [llm.chat, memory, tools]
    skills: [builtin:web_search]
    memory: builtin:conversational

gateway:
  # one shared listener; channels mount paths on it
  listen: ":8080"
  channels:
    - type: webhook
      path: /webhook/
      agent: bot

tools:
  policy:
    default: all
