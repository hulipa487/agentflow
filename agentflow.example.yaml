# AgentFlow example configuration.
#
# Full runnable scenarios and single-pattern Lua loops live in the companion
# AgentFlow Studio repository (`examples/`). For a minimal starter on disk, run:
#
#   ./agentflow init mybot
#   ./agentflow validate -config mybot
#   ./agentflow run -config mybot
#
# Or validate this file directly from any directory:
#
#   ./agentflow validate -config path/to/agentflow.example.yaml
#   ./agentflow run -config path/to/agentflow.example.yaml -log-level debug
#
# Relative paths resolve against this file's directory, not the shell's
# working directory, so the two commands above behave the same.
#
# This example boots with no external services as a headless admin/Studio
# control plane (`agents:` below is commented out so no local files are required).
# Everything is on the one HTTP port, gateway.listen: the channels, and the
# headless admin/Studio API under /admin/api/ (plus /healthz, /readyz and
# /metrics). Connect AgentFlow Studio to http://127.0.0.1:8080 with the admin
# token. Without ADMIN_TOKEN (or operators) the token is minted per boot and
# the admin API answers only clients on this machine.
#
# Run `agentflow help` for commands and flags. The optional sections below are
# comments: uncomment only what your deployment has.

version: "1"

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
# `provider` selects the wire shape; `base_url` selects the host. api_key may
# be empty for a keyless local endpoint. ${VAR:-default} expands at load.
models:
  default:
    provider: openai
    model: llama3.1
    base_url: http://127.0.0.1:11434/v1   # Ollama / vLLM / LiteLLM / OpenRouter
    # Keep secrets out of tracked config; export this variable or point at a
    # credential-store entry with cred:<service>.
    api_key: ${OPENAI_API_KEY:-}
    timeout: 90s
    retry: 1
    # thinking: medium                      # off | low | medium | high | xhigh | max
    # server_tools: []                      # provider-native tools (e.g. google_search on gemini)
  # A dedicated classifier model for safety moderation. It must be
  # engine-keyed (no key_source: user) and should be small and fast. This entry
  # is referenced by safety.classifiers below.
  # moderation:
  #   provider: openai
  #   model: gpt-4.1-mini
  #   api_key: ${MODERATION_API_KEY}
  #   timeout: 3s
  #   retry: 0
  #   max_tokens: 64

# ---------------------------------------------------------------------------
# Runtime
# ---------------------------------------------------------------------------
runtime:
  persistence: sqlite://./data/agentflow.db

  admin:
    # The admin plane has no port of its own; it is served on gateway.listen.
    # Local-only transport for Studio on this machine. To take the admin API
    # off the HTTP listener, set tcp: false and name the platform's socket
    # instead; the bearer token is required either way:
    #   Windows: socket: '\\.\pipe\agentflow-admin'
    #   Unix:    socket: /run/agentflow/admin.sock
    # Named operator tokens have the same authority as ADMIN_TOKEN and are
    # attributed in the X-Operator header/logs.
    # operators: { alice: "${ALICE_ADMIN_TOKEN}" }
    # CORS is only for browser clients of the API (the native Studio app sends
    # the token directly and needs no entry). Exact origins only; "*" is
    # refused. Vite's two spellings are different origins.
    # cors_origins: ["http://127.0.0.1:5173", "http://localhost:5173"]

  # Op-pool size, and the only place it is set; unset uses 8.
  scheduler:
    workers: 8

  studio:
    enabled: true
    workspace: ""             # default: <config dir>/studio
    trace_events: 2000        # per-session trace ring
    trace_sessions: 200       # session rings retained
    trace_payloads: false     # true also captures message/reply text
    chat_timeout: 120s

  limits:
    sessions_per_tenant: 50   # 0 disables
    ephemeral_per_tenant: 16  # one-turn sessions (OpenAI channel); 0 disables
    egress_per_minute: 60     # http.request + mail.send, per tenant

  # Conversations. An idle session is unloaded after this long; its Lua locals
  # are gone, session.state.* survives, and the next message recreates it.
  sessions:
    idle_unload: 30m          # 0 disables unloading

  timezone_offset_hours: 0    # cron triggers; every: is unaffected

# Audit journal: every inbound and outbound message. 0 keeps forever.
audit:
  enabled: true
  retention_days: 90

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
memory:
  backends:
    main_db:
      provider: sqlite
      config:
        path: ./data/agentflow.db

# ---------------------------------------------------------------------------
# Model-backed safety classifiers (optional)
# ---------------------------------------------------------------------------
# A classifier sends message/reply text to a dedicated model and maps the
# returned label + score to allow/review/block. Profiles opt in by listing
# classifier:<name> in their filters. The model must exist in models: and must
# be engine-keyed. `safe: allow` is required so the model can report benign
# text. See configuration.md in AgentFlow Studio's docs for every field.
# safety:
#   classifiers:
#     moderation:
#       model: moderation
#       prompt: safety/moderation        # prompts: registry key; default embedded
#       mode: enforce                    # enforce | shadow
#       directions: [ingress, egress]
#       sources: [channel, agent]
#       threshold: 0.7
#       categories:
#         safe: allow
#         self_harm: block
#         violence: block
#         harassment: review
#         prompt_injection: block
#       timeout: 2s
#       on_error: block                  # block | pass
#       on_saturated: block
#       on_budget_exhausted: block
#       max_tokens: 64
#       max_input_chars: 8000
#       max_concurrency: 8
#       cache: { size: 10000, ttl: 5m }
#       budget: { tokens_per_day: 500000 }
#       refusal: ""                      # optional ingress refusal text
#       fallback: ""                     # optional egress fallback text
#   lua_filters:
#     pii_mask:
#       directions: [ingress, egress]
#       timeout: 200ms
#       instr_budget: 100000
#       on_error: pass                   # pass | block
#       source: |
#         function egress(input)
#           local out = string.gsub(input.text, "sk%-[A-Za-z0-9]+", "[REDACTED]")
#           return { text = out }
#         end

profiles:
  memory:
    assistant:
      stores:
        dialogue: { backend: main_db, table: dialogue }
        facts:    { backend: main_db, table: facts }
      write: [plugin:routing_table]
      recall: plugin:recency
      # To share this store deliberately, bind it to a named pool created via
      # the tenancy admin API: { backend: main_db, table: dialogue, pool: team }
      # `shared: true` is a boot error.

  # Safety profiles select the core-owned filter chain. "default" and "none"
  # are built in; this one shows the shape. To add model moderation, define a
  # safety.classifiers entry above and use:
  #   filters: [source-attribution, classifier:moderation, affect-guard]
  safety:
    strict:
      filters: [source-attribution, signal-gate, steady-directive, support-offer, affect-guard]

# ---------------------------------------------------------------------------
# Shell
# ---------------------------------------------------------------------------
# Shell commands run as one-off sandbox jobs (`gvisor` on Linux, or
# `microsandbox` via `msb` on Linux KVM / macOS Apple Silicon HVF / Windows WHP):
# a command gets a declared environment and one project from the files store as
# its working directory, runs under a time limit, and whatever it wrote into the
# project is stored when it ends. Nothing else survives.
# `agentflow doctor` says whether the configured sandbox can run on this host.
#
# environments:
#   python:
#     image: docker.io/library/python:3.12-slim@sha256:<digest>   # pinned; pulled on first use
#     env: { PYTHONUNBUFFERED: "1" }
#   tools:
#     rootfs: /srv/agentflow/envs/tools      # or a root filesystem already on this host
#
# profiles:
#   shell:
#     code:
#       provider: sandbox        # sandbox (default) | ssh
#       environment: python
#       project: workspace       # the files-store project jobs run in
#       timeout: 90s             # capped by runtime.sandbox.max_timeout
#       ignore: ["node_modules/", "__pycache__/"]   # created by jobs, never stored
#     box:
#       provider: ssh            # a real remote machine, with a real connection
#       host: build.example.com:22
#       user: dev
#       key_file: /etc/agentflow/id_ed25519
#
# runtime:
#   sandbox:                     # every setting has a default
#     provider: gvisor           # gvisor (default, Linux runsc) | microsandbox (msb microVM)
#     # runsc: runsc             # path to gVisor runsc binary
#     # microsandbox: msb        # path to superradcompany/microsandbox msb CLI binary
#     concurrency: 4             # jobs at once on this instance
#     per_user: 2
#     queue_timeout: 30s
#     timeout: 60s
#     max_timeout: 10m
#     background_max_timeout: 2h # shell.start jobs
#     memory: 1GiB               # enforced where the host allows; doctor says
#     output_limit: 256KiB
#
# A project may customise its agent's profile with .agentflow/shell.yaml
# (environment, env, workdir, timeout, ignore) — nothing that raises a limit.
#
# An agent uses a profile with `shell: code` and the shell.exec capability.

# ---------------------------------------------------------------------------
# Agents
# ---------------------------------------------------------------------------
# `agents:` may be omitted (as here, so no external loop/prompt files are
# required to boot). The runtime then starts as a headless admin/Studio control
# plane where agents can be created live, or run `agentflow init mybot` for a
# minimal file-based echo loop. Full scenarios live in agentflow-studio/examples/.
# agents:
#   # A conversational agent with memory. Needs the model above to be reachable.
#   assistant:
#     loop: ./loops/chat.lua
#     model: default
#     instructions: ./prompts/assistant.md
#     memory: assistant
#     safety: strict
#     history_budget: 6000
#     capabilities: [llm.chat, memory, tools]
#     skills: [builtin:fetch]
#     budget:
#       tokens_per_day: 100000
#
#   # No model needed: replies with what it received.
#   echo:
#     loop: ./loops/echo.lua
#     capabilities: [tools]

# ---------------------------------------------------------------------------
# Gateway
# ---------------------------------------------------------------------------
gateway:
  # Routing is Lua. The builtin per_chat handler keys a session per chat and
  # supports the /group <uuid> toggle; replace it with plugin:<name> or a path.
  route: plugin:per_chat
  listen: 127.0.0.1:8080
  # Required for telegram mode: webhook (the provider must reach this URL).
  # public_url: https://agentflow.example.com
  channels: []
    # - type: webhook
    #   name: local
    #   path: /webhook/local/       # must end in "/"
    #   agent: echo
    #   timeout: 55s
    # - type: telegram
    #   name: tg
    #   agent: assistant
    #   token: ${TELEGRAM_BOT_TOKEN}
    #   mode: polling              # polling | webhook | auto
    #   allow_users: []
    #
    # QQ Bot (Tencent's official QQ Open Platform API). websocket mode connects
    # out to the QQ gateway, so nothing needs to be public; webhook mode takes
    # callbacks at path (set <public https url><path> in the q.qq.com console).
    # Requires a public media URL publisher: configure media.backend: s3 or
    # media.temp_url.enabled: true (with gateway.public_url), otherwise the
    # QQ channel is skipped at boot.
    # - type: qq
    #   name: qq
    #   agent: assistant
    #   app_id: "102xxxxxx"
    #   secret: ${QQ_BOT_SECRET}
    #   mode: websocket            # websocket | webhook
    #   scenes: [c2c, group, guild] # c2c | group | guild | dm
    #   markdown: true             # markdown replies (private chats and groups)
    #
    # Feishu / Lark Open Platform bot. websocket mode (default) connects out over
    # Feishu's persistent WS gateway; webhook mode mounts /webhook/feishu/<name>/.
    # - type: feishu
    #   name: feishu
    #   agent: assistant
    #   app_id: cli_xxxxxxxxx
    #   secret: ${FEISHU_APP_SECRET}
    #   mode: websocket            # websocket | webhook
    #   # token: ${FEISHU_VERIFICATION_TOKEN}   # required for webhook unless encrypt_key set
    #   # encrypt_key: ${FEISHU_ENCRYPT_KEY}    # optional AES-256-CBC webhook encryption
    #   # api_base: https://open.larksuite.com  # use Lark international domain if needed
    #   scenes: [p2p, group]       # p2p | group | group_all
    #   markdown: true
    #
    # WeCom (企业微信) self-built app callback. Receive Message URL defaults to
    # <public https url>/webhook/wecom/<name>/ with SHA-1 + AES-256-CBC crypto.
    # - type: wecom
    #   name: wecom
    #   agent: assistant
    #   corp_id: wwxxxxxxxxx
    #   agent_id: 1000002
    #   secret: ${WECOM_SECRET}
    #   token: ${WECOM_CALLBACK_TOKEN}
    #   encrypt_key: ${WECOM_ENCODING_AES_KEY}  # 43-character EncodingAESKey
    #   markdown: true
    #
    # - type: ghhook
    #   name: github
    #   agent: assistant
    #   path: /webhook/github/
    #   secret: ${GITHUB_WEBHOOK_SECRET}
    #
    # Bridge adapter: your adapter POSTs events to `path`, HMAC-signed with
    # `secret`; the runtime POSTs replies to deliver_url with `token` as a bearer.
    # - type: bridge
    #   name: teams
    #   agent: assistant
    #   path: /bridge/teams/
    #   deliver_url: https://bridge.example.com/deliver
    #   secret: ${BRIDGE_SECRET}
    #   token: ${BRIDGE_TOKEN}
    #
    # OpenAI-compatible channel: any Chat Completions client works with only a
    # base URL and a key. `model` names one of the exposed agents, and each
    # runs its own loop: point an agent at `openai_passthrough.lua` (see
    # `examples/loops/openai_passthrough.lua` in agentflow-studio) to forward
    # the client's messages, tools and sampling parameters to its model
    # unchanged. Use auth: user_token for per-user identity, or auth: none only
    # on a loopback listener.
    # - type: openai
    #   name: api
    #   path: /v1/                 # serves <path>chat/completions and <path>models
    #   agents: [assistant]        # exposed as model ids
    #   auth: key                  # user_token | key | none
    #   keys: ["${COMPAT_API_KEY}"]
    #   timeout: 600s              # whole-request limit
    #   max_request_bytes: 33554432
    #   journal: metadata          # full | metadata | off (metadata is this type's default)
    #   expose_reasoning: false    # send model reasoning as reasoning_content

# ---------------------------------------------------------------------------
# Scheduled triggers (engine-fired; no agent scheduler needed)
# ---------------------------------------------------------------------------
# triggers:
#   - name: daily-digest
#     cron: "0 9 * * *"            # matched in runtime.timezone_offset_hours
#     target: { profile: assistant }
#     payload: { task: digest }
#   - name: heartbeat
#     every: 15m
#     target: { profile: echo }
#     payload: { event: heartbeat }

# ---------------------------------------------------------------------------
# Optional surfaces (commented: each needs its own backend or key)
# ---------------------------------------------------------------------------
# runtime:
#   identity: { enabled: true }              # profiles + per-user scopes (require_registration, unregistered)
#   users: { enabled: true, cors_origins: ["http://127.0.0.1:3000"] }
#   credentials: { enabled: true }           # needs CREDENTIALS_MASTER_KEY; follows runtime.persistence
#   log_plane: { persistence: ./data/log }   # JSONL journal + usage, per UTC day
#   cluster: { session_ttl: 30s, poll_interval: 250ms }

# media:
#   backend: fs                              # fs (default) | s3; files shares this store unless files.* sets its own
#   dir: ./data/media
#   retention: 168h                          # per-scope media grant lifetime (default 7d; 0 = forever)
#   derived_ttl: 24h                         # cached transcoded variant lifetime (default 24h)
#   gc_grace: 24h                            # blob GC grace window (default 24h; 0 = GC disabled)
#   temp_url:                                # optional HMAC-SHA256 temporary URLs on gateway.public_url (for QQ on fs)
#     enabled: false
#     path: /media/t/
#     ttl: 10m
#     secret: ${MEDIA_TEMP_URL_SECRET}       # optional in single-node; set in multi-instance fleets
#
# usage:
#   events: true                             # per-call detail (default off)
#   retention_days: 30
#
# observability:
#   tracing:
#     enabled: false
#     provider: otlp                         # otlp (OTLP/HTTP JSON) | langfuse
#     endpoint: https://otel.example.com     # or https://cloud.langfuse.com for langfuse
#     service_name: agentflow
#     # headers: { Authorization: "Bearer ${OTEL_TOKEN}" } # generic OTLP headers
#     # public_key: ${LANGFUSE_PUBLIC_KEY}                 # langfuse Basic auth
#     # secret_key: ${LANGFUSE_SECRET_KEY}                 # langfuse Basic auth
#     sample_rate: 1.0
#     include_payloads: false
#     batch_size: 64
#     flush_interval: 5s
#     timeout: 10s

# prompts:
#   assistant: { file: ./prompts/assistant.md }   # shared prompt registry

# Declarative HTTP tools need no Go code. Each becomes http:<name>; add that
# name to an agent's `skills` list to expose it to the model.
# tools:
#   http:
#     - name: crm_lookup
#       description: Look up a customer by email address.
#       method: GET
#       url: https://api.example.com/v1/customers
#       query: { email: "{email}" }
#       auth: { service: crm }        # credential store / cred:<service>
#       params:
#         type: object
#         properties:
#           email: { type: string, description: Customer email address. }
#         required: [email]
#       response: customer
#       timeout: 15s
#   policy:
#     default: all
#     forbidden: [builtin:shell.exec]
#     overrides:
#       builtin:fetch:
#         description: "Fetch a URL and return its text."

# plugins:
#   dir: ./plugins            # shadow builtin loops by name
#   enforce_capabilities: true

# packages:
#   shared: ./packages/shared # Lua source packages; -- af-import: shared
#
# Config-directory layout (preferred for larger deployments):
#
#   agentflow run -config ./deploy      # directory, not a file
#   deploy/system.yaml                  # runtime, models, memory, gateway
#   deploy/channels.yaml                # gateway.channels
#   deploy/profiles/*.yaml              # one agent per file; spawn: true = template
#   deploy/loops/, deploy/prompts/      # paths relative to deploy/
#
# Each optional surface above needs its own backend or environment variable.
