<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="540" height="160">
  <defs>
    <!-- High-Contrast Light Mode Gradient -->
    <linearGradient id="af-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Secondary Feedback Loop Gradient -->
    <linearGradient id="af-subgrad-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#7E22CE" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Elevation Drop Shadow for Hexagon Container -->
    <filter id="af-shadow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- ICON MARK (Left) -->
  <g transform="translate(24, 20)">
    <!-- Outer Hexagonal Container (Runtime Boundary) -->
    <polygon points="60,6 110,34 110,90 60,118 10,90 10,34" fill="#FFFFFF" stroke="url(#af-grad-light)" stroke-width="3.5" stroke-linejoin="round" filter="url(#af-shadow-light)" />

    <!-- Inner Geometric Grid Lines -->
    <path d="M 60,6 L 60,118 M 10,34 L 110,90 M 110,34 L 10,90" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Execution Flow Paths (Forming an abstract 'A' & branching nodes) -->
    <path d="M 32,84 C 32,56 46,42 60,34 C 74,42 88,56 88,84" fill="none" stroke="url(#af-grad-light)" stroke-width="5" stroke-linecap="round" />

    <!-- Crossbar / Feedback Loop -->
    <path d="M 36,68 Q 60,76 84,68" fill="none" stroke="url(#af-subgrad-light)" stroke-width="4" stroke-linecap="round" />

    <!-- Agent Nodes -->
    <!-- Top Orchestrator Node -->
    <circle cx="60" cy="34" r="6.5" fill="#0284C7" />
    <circle cx="60" cy="34" r="2.8" fill="#FFFFFF" />

    <!-- Bottom-Left Input/Worker Node -->
    <circle cx="32" cy="84" r="5.5" fill="#4F46E5" />
    <circle cx="32" cy="84" r="2.2" fill="#FFFFFF" />

    <!-- Bottom-Right Output/Worker Node -->
    <circle cx="88" cy="84" r="5.5" fill="#9333EA" />
    <circle cx="88" cy="84" r="2.2" fill="#FFFFFF" />

    <!-- Center Routing Pulse -->
    <circle cx="60" cy="71" r="4" fill="#0284C7" />
  </g>

  <!-- WORDMARK (Right, Vertically Centered) -->
  <g transform="translate(162, 102)">
    <text x="0" y="0" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#0F172A">
      Agent<tspan fill="url(#af-grad-light)">Flow</tspan>
    </text>
  </g>
</svg>