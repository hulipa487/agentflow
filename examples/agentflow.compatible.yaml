# AgentFlow LLM provider config — Anthropic and OpenAI compatible endpoints.
#
# The model is keyed by a name you choose ("fast", "smart", ...). Each entry
# selects an API SHAPE (provider) and a HOST (base_url). base_url is what
# makes these "compatible endpoints" rather than the official APIs:
#
#   provider: anthropic → speaks the Anthropic Messages API shape
#   provider: openai    → speaks the OpenAI Chat Completions API shape
#                          (also used for vLLM, Ollama, LiteLLM, OpenRouter, etc.)
#
# Convention:
#   - OpenAI: base_url should include /v1 (the runtime appends /chat/completions).
#     Example: http://127.0.0.1:11434/v1 produces /v1/chat/completions.
#   - Anthropic: base_url is the host root (the runtime appends /v1/messages).
#   - A trailing slash is trimmed. api_key may be empty for keyless endpoints.

models:
  # ── Anthropic-shape endpoint, self-hosted/proxied ──
  smart:
    provider: anthropic
    model: claude-sonnet-5
    base_url: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
    api_key: ${ANTHROPIC_API_KEY}
    timeout: 60s
    retry: 2

  # ── OpenAI-shape endpoint, self-hosted/proxied (vLLM, Ollama, LiteLLM, ...) ──
  fast:
    provider: openai
    model: gpt-4o-mini
    base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    api_key: ${OPENAI_API_KEY}
    timeout: 60s
    retry: 2

  # ── Local keyless endpoint (Ollama) ──
  local:
    provider: openai
    model: llama3.1
    base_url: http://127.0.0.1:11434/v1
    api_key: ""          # omitted → no Authorization header sent

agents:
  bot:
    loop: builtin:react
    model: smart          # reference one of the names above
    instructions: ./instructions/bot.md
    history_budget: 6000

gateway:
  channels:
    - type: webhook
      listen: ":8080"
      path: /webhook
      agent: bot
