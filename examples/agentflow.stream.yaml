version: "1"

# llm.stream example: the loop consumes the completion delta-by-delta.
# Requires a local OpenAI-compatible model (Ollama by default).
#   curl -X POST localhost:8081/webhook -d '{"from":"alice","text":"hi"}'

models:
  default:
    provider: openai
    model: ${OPENAI_MODEL:-gpt-4o-mini}
    base_url: ${OPENAI_BASE_URL:-http://127.0.0.1:11434/v1}
    api_key: ${OPENAI_API_KEY:-}

agents:
  streamer:
    loop: ./plugins/examples/stream.lua
    model: default

gateway:
  # one shared listener; channels mount paths on it
  listen: ":8081"
  channels:
    - type: webhook
      path: /webhook/
      agent: streamer
