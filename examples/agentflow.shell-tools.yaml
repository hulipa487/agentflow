version: "1"

# Shell + fs tools example.
# Requires Docker installed and running for shell.spawn(provider=docker), and
# a local OpenAI-compatible model (Ollama by default).

models:
  default:
    provider: openai
    model: ${OPENAI_MODEL:-gpt-4o-mini}
    base_url: ${OPENAI_BASE_URL:-http://127.0.0.1:11434/v1}
    api_key: ${OPENAI_API_KEY:-}

profiles:
  shell:
    sandboxed:
      provider: docker
      image: alpine:latest
      workdir: /work
      network: none
      mem_limit: 512m
      cpu_limit: 1.0

agents:
  bot:
    loop: builtin:react
    model: default
    instructions: ./instructions/bot.md
    capabilities: [llm.chat, memory, tools, shell.exec]
    skills:
      - builtin:web_search
      - builtin:fs.read
      - builtin:fs.write
    memory: builtin:conversational
    shell: sandboxed

gateway:
  # one shared listener; channels mount paths on it
  listen: ":8080"
  channels:
    - type: webhook
      path: /webhook/
      agent: bot

tools:
  policy:
    default: all
