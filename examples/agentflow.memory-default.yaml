version: "1"

# builtin:conversational memory with the auto-created default sqlite backend.
# No explicit memory.backends block is needed — the default is provisioned.
# Requires a local OpenAI-compatible model (Ollama by default).
#   curl -X POST localhost:8081/webhook -d '{"from":"alice","text":"hi"}'

models:
  default:
    provider: openai
    model: ${OPENAI_MODEL:-gpt-4o-mini}
    base_url: ${OPENAI_BASE_URL:-http://127.0.0.1:11434/v1}
    api_key: ${OPENAI_API_KEY:-}

agents:
  bot:
    loop: builtin:react
    model: default
    instructions: ./instructions/bot.md
    capabilities: [llm.chat, memory, tools]
    skills: [builtin:web_search]
    memory: builtin:conversational

gateway:
  # one shared listener; channels mount paths on it
  listen: ":8081"
  channels:
    - type: webhook
      path: /webhook/
      agent: bot
