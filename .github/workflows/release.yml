name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: agentflow-linux-amd64
          - os: macos-latest
            artifact: agentflow-darwin-arm64
          - os: windows-latest
            artifact: agentflow-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goto-bus-stop/setup-zig@v2
        if: runner.os == 'Windows'
        with:
          version: 0.13.0
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            make BIN=agentflow.exe
            cp agentflow.exe "${{ matrix.artifact }}"
          else
            make
            cp agentflow "${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
