# agentflow loop test examples/qq-group-chat/tests/group_chat.yaml
agent: group_bot
loop: ../loops/group_chat.lua
messages:
  - from: ann
    text: what should we cook tonight?
  - from: ann
    text: /remember Bob is vegetarian
llm:
  - match: cook
    text: "Pasta primavera, Ann?"
ops:
  session.state.get: "null"
  session.state.set: "{}"
  store.query: '{"records": []}'
  store.put: "{}"
expect:
  - "Pasta primavera, Ann?"
  - "Noted, I'll remember: Bob is vegetarian"
# The harness gives the agent no memory stores, so memory.write routes
# nowhere here; in a deployment it writes to qq_dialogue and qq_facts.
expect_ops: [session.state.get, llm.chat, session.state.set]
