# QQ group chatbot with memory and context.
#
#   export OPENAI_API_KEY=...  QQ_APPID=...  QQ_APPSECRET=...
#   agentflow validate -config examples/qq-group-chat/agentflow.yaml
#   agentflow -config examples/qq-group-chat/agentflow.yaml
#
# Then @-mention the bot in a QQ group it has been added to. See README.md.

version: "1"

runtime:
  persistence: sqlite://./data/agentflow.db
  sessions:
    idle_unload: 30m        # a quiet group's session unloads; session.state keeps its context

models:
  default:
    provider: openai        # any OpenAI-compatible endpoint
    model: ${CHAT_MODEL:-gpt-4.1-mini}
    base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    api_key: ${OPENAI_API_KEY}

memory:
  backends:
    main_db:
      provider: sqlite
      config:
        path: ./data/agentflow.db

profiles:
  memory:
    group:
      stores:
        dialogue: { backend: main_db, table: qq_dialogue }   # every exchange
        facts:    { backend: main_db, table: qq_facts }      # /remember
      write: [plugin:routing_table]    # "turn" records -> dialogue, "fact" -> facts
      recall: plugin:recency           # kind = "text" is full-text search

agents:
  group_bot:
    loop: ./loops/group_chat.lua
    model: default
    instructions: ./prompts/persona.md
    memory: group
    history_budget: 6000
    capabilities: [llm.chat, memory, session.state]

gateway:
  listen: 127.0.0.1:8080
  channels:
    - type: qq
      name: qq
      agent: group_bot
      app_id: ${QQ_APPID}
      secret: ${QQ_APPSECRET}
      mode: websocket       # connects out; nothing needs to be public
      scenes: [group]       # @-mentions in groups; add c2c for private chats too
      markdown: true        # if your bot has markdown; refused replies fall back to text
