version: "1"

# Keyless chatbot: builtin:react loop + a local OpenAI-compatible model + webhook.
# Defaults to Ollama (http://127.0.0.1:11434/v1); no api_key needed locally.
#   export OPENAI_MODEL=gpt-4o-mini   # or your local model name
#   curl -X POST localhost:8080/webhook -d '{"from":"alice","text":"hello"}'
#
# Two different "from" users get independent sessions/history (per_chat).

models:
  default:
    provider: openai
    model: ${OPENAI_MODEL:-gpt-4o-mini}
    base_url: ${OPENAI_BASE_URL:-http://127.0.0.1:11434/v1}
    api_key: ${OPENAI_API_KEY:-}     # empty for keyless local endpoints

agents:
  bot:
    loop: builtin:react
    model: default
    instructions: ./instructions/bot.md

gateway:
  channels:
    - type: webhook
      listen: ":8080"
      path: /webhook
      agent: bot
