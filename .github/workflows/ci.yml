name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -trimpath -o agentflow.exe ./cmd/agentflow
          else
            go build -trimpath -o agentflow ./cmd/agentflow
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Config schema & loop checks
        shell: bash
        run: |
          BIN=./agentflow
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./agentflow.exe; fi
          "$BIN" config schema > /dev/null
          tmp=$(mktemp -d)
          "$BIN" init "$tmp/starter"
          "$BIN" validate -config "$tmp/starter"
          "$BIN" loop check "$tmp/starter/loops/echo.ts"
          rm -rf "$tmp"
