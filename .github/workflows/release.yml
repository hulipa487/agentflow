name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: agentflow-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: agentflow-linux-arm64
          - goos: darwin
            goarch: arm64
            artifact: agentflow-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact: agentflow-windows-amd64.exe
          - goos: windows
            goarch: arm64
            artifact: agentflow-windows-arm64.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" -o "${{ matrix.artifact }}" ./cmd/agentflow
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
