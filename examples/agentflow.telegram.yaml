version: "1"

# Real chatbot: builtin:react + Anthropic + Telegram long-poll.
#   export ANTHROPIC_API_KEY=... TG_TOKEN=...
#   ./agentflow -config examples/agentflow.telegram.yaml

models:
  default:
    provider: anthropic
    model: claude-sonnet-5
    api_key: ${ANTHROPIC_API_KEY}
    timeout: 60s
    retry: 2

agents:
  bot:
    loop: builtin:react
    model: default
    instructions: ./instructions/bot.md
    history_budget: 6000

gateway:
  channels:
    - type: telegram
      token: ${TG_TOKEN}
      allow_users: []   # telegram user ids; empty = allow all
      agent: bot
